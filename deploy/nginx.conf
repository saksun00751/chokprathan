# nginx in front of the app. Replace example.com and the certificate paths.
limit_req_zone $binary_remote_addr zone=site:20m rate=30r/s;
# Server Actions (logins, OTP, bets) are POSTs: a tighter limit for them only.
map $request_method $post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $post_key zone=posts:20m rate=8r/s;
limit_req_status 429;

upstream chokprathan {
  server app:3000;            # docker compose; use 127.0.0.1:3000 with PM2
  keepalive 64;
}

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 4m;     # banner and slip uploads are at most 2 MB
  client_body_timeout 15s;
  client_header_timeout 15s;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://chokprathan;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    limit_req zone=site burst=80 nodelay;
    limit_req zone=posts burst=20 nodelay;
    proxy_pass http://chokprathan;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) so visitors cannot forge their address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
