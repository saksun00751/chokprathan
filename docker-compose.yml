# Production-like stack: the app (2 replicas) behind nginx. MariaDB is external (DATABASE_URL).
# For local development with a throwaway database, uncomment the "db" service.
services:
  app:
    build: .
    env_file: .env.production.local
    environment:
      TRUST_PROXY: "1"
    restart: unless-stopped
    deploy:
      replicas: 2
    expose:
      - "3000"
  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
